# ============================================================================
# 🔍 Datadog Runner - CI 워크플로우 (Pull Request)
# ============================================================================
# 기능:
#   - PR 시 코드 린트 및 테스트
#   - Docker 이미지 빌드 테스트 (푸시 없이)
#   - Kubernetes 매니페스트 검증
#   - 보안 스캔
# ============================================================================

name: 🔍 CI - Pull Request

# 🚫 임시 비활성화
# on:
#   pull_request:
#     branches:
#       - main
#       - develop
#     types:
#       - opened
#       - synchronize
#       - reopened
on:
  workflow_dispatch:  # 수동 실행만 허용

env:
  AWS_REGION: ap-northeast-2

jobs:
  # ============================================================================
  # 1️⃣ 변경된 서비스 감지
  # ============================================================================
  detect-changes:
    name: 🔍 Detect Changes
    runs-on: ubuntu-latest
    outputs:
      auth-python: ${{ steps.filter.outputs.auth-python }}
      chat-node: ${{ steps.filter.outputs.chat-node }}
      ranking-java: ${{ steps.filter.outputs.ranking-java }}
      frontend-react: ${{ steps.filter.outputs.frontend-react }}
      api-gateway: ${{ steps.filter.outputs.api-gateway }}
      load-generator: ${{ steps.filter.outputs.load-generator }}
      k8s-manifests: ${{ steps.filter.outputs.k8s-manifests }}
    steps:
      - uses: actions/checkout@v6
      
      - uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            auth-python:
              - 'auth-python/**'
            chat-node:
              - 'chat-node/**'
            ranking-java:
              - 'ranking-java/**'
            frontend-react:
              - 'frontend-react/**'
            api-gateway:
              - 'api-gateway/**'
            load-generator:
              - 'load-generator/**'
            k8s-manifests:
              - 'infra/infra/k8s/**'

  # ============================================================================
  # 2️⃣ Python 서비스 테스트 (auth-python, load-generator)
  # ============================================================================
  test-python:
    name: 🐍 Test Python
    needs: detect-changes
    if: needs.detect-changes.outputs.auth-python == 'true' || needs.detect-changes.outputs.load-generator == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: 
          - ${{ needs.detect-changes.outputs.auth-python == 'true' && 'auth-python' || '' }}
          - ${{ needs.detect-changes.outputs.load-generator == 'true' && 'load-generator' || '' }}
        exclude:
          - service: ''
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: '${{ matrix.service }}/requirements.txt'
      
      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx ruff mypy
      
      - name: 🔍 Lint with Ruff
        run: |
          cd ${{ matrix.service }}
          ruff check . --output-format=github || true
      
      - name: 🔍 Type check with MyPy
        run: |
          cd ${{ matrix.service }}
          mypy . --ignore-missing-imports || true
      
      - name: 🧪 Run tests
        run: |
          cd ${{ matrix.service }}
          if [ -d "tests" ]; then
            pytest tests/ -v --tb=short
          else
            echo "⚠️ 테스트 디렉토리가 없습니다. 건너뜁니다."
          fi

  # ============================================================================
  # 3️⃣ Node.js 서비스 테스트 (chat-node)
  # ============================================================================
  test-node:
    name: 📦 Test Node.js
    needs: detect-changes
    if: needs.detect-changes.outputs.chat-node == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'chat-node/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd chat-node
          npm ci
      
      - name: 🔍 Lint
        run: |
          cd chat-node
          npm run lint || true
      
      - name: 🧪 Run tests
        run: |
          cd chat-node
          npm test || echo "⚠️ 테스트가 없습니다."

  # ============================================================================
  # 4️⃣ Java 서비스 테스트 (ranking-java)
  # ============================================================================
  test-java:
    name: ☕ Test Java
    needs: detect-changes
    if: needs.detect-changes.outputs.ranking-java == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
      
      - name: 🔨 Build with Maven
        run: |
          cd ranking-java
          mvn clean compile -DskipTests
      
      - name: 🧪 Run tests
        run: |
          cd ranking-java
          mvn test || echo "⚠️ 테스트가 없습니다."

  # ============================================================================
  # 5️⃣ Frontend 테스트 (frontend-react)
  # ============================================================================
  test-frontend:
    name: ⚛️ Test Frontend
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend-react == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend-react/package-lock.json'
      
      - name: Install dependencies
        run: |
          cd frontend-react
          npm ci
      
      - name: 🔍 Lint
        run: |
          cd frontend-react
          npm run lint || true
      
      - name: 🔨 Build
        run: |
          cd frontend-react
          npm run build
        env:
          VITE_DD_RUM_APP_ID: "test-app-id"
          VITE_DD_RUM_CLIENT_TOKEN: "test-client-token"

  # ============================================================================
  # 6️⃣ Docker 이미지 빌드 테스트
  # ============================================================================
  build-test:
    name: 🐳 Docker Build Test
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth-python
            changed: ${{ needs.detect-changes.outputs.auth-python }}
          - service: chat-node
            changed: ${{ needs.detect-changes.outputs.chat-node }}
          - service: ranking-java
            changed: ${{ needs.detect-changes.outputs.ranking-java }}
          - service: frontend-react
            changed: ${{ needs.detect-changes.outputs.frontend-react }}
          - service: api-gateway
            changed: ${{ needs.detect-changes.outputs.api-gateway }}
          - service: load-generator
            changed: ${{ needs.detect-changes.outputs.load-generator }}
    steps:
      - uses: actions/checkout@v6
        if: matrix.changed == 'true'
      
      - name: Set up Docker Buildx
        if: matrix.changed == 'true'
        uses: docker/setup-buildx-action@v3
      
      - name: 🔨 Build Docker image (no push)
        if: matrix.changed == 'true'
        uses: docker/build-push-action@v5
        with:
          context: ./${{ matrix.service }}
          platforms: linux/amd64
          push: false
          tags: ${{ matrix.service }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            ${{ matrix.service == 'frontend-react' && 'VITE_DD_RUM_APP_ID=test-app-id' || '' }}
            ${{ matrix.service == 'frontend-react' && 'VITE_DD_RUM_CLIENT_TOKEN=test-token' || '' }}

  # ============================================================================
  # 7️⃣ Kubernetes 매니페스트 검증
  # ============================================================================
  validate-k8s:
    name: ☸️ Validate K8s Manifests
    needs: detect-changes
    if: needs.detect-changes.outputs.k8s-manifests == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Install kubeval
        run: |
          wget https://github.com/instrumenta/kubeval/releases/latest/download/kubeval-linux-amd64.tar.gz
          tar xf kubeval-linux-amd64.tar.gz
          sudo mv kubeval /usr/local/bin/
      
      - name: 🔍 Validate manifests
        run: |
          echo "📋 Kubernetes 매니페스트 검증 중..."
          
          for manifest in infra/infra/k8s/*.yaml; do
            echo "검증 중: $manifest"
            kubeval "$manifest" --strict || true
          done

      - name: Install kube-score
        run: |
          wget https://github.com/zegl/kube-score/releases/download/v1.18.0/kube-score_1.18.0_linux_amd64.tar.gz
          tar xf kube-score_1.18.0_linux_amd64.tar.gz
          sudo mv kube-score /usr/local/bin/
      
      - name: 📊 Score manifests
        run: |
          echo "📊 Kubernetes 매니페스트 점수 평가..."
          
          for manifest in infra/infra/k8s/*.yaml; do
            echo ""
            echo "=== $manifest ==="
            kube-score score "$manifest" || true
          done

  # ============================================================================
  # 8️⃣ 보안 스캔
  # ============================================================================
  security-scan:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'
      
      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ============================================================================
  # 9️⃣ PR 요약
  # ============================================================================
  pr-summary:
    name: 📊 PR Summary
    needs: [test-python, test-node, test-java, test-frontend, build-test, validate-k8s, security-scan]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate summary
        run: |
          echo "# 🔍 PR 검증 요약" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| 검증 항목 | 상태 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| Python 테스트 | ${{ needs.test-python.result == 'success' && '✅' || needs.test-python.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js 테스트 | ${{ needs.test-node.result == 'success' && '✅' || needs.test-node.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Java 테스트 | ${{ needs.test-java.result == 'success' && '✅' || needs.test-java.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Frontend 테스트 | ${{ needs.test-frontend.result == 'success' && '✅' || needs.test-frontend.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker 빌드 | ${{ needs.build-test.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| K8s 매니페스트 | ${{ needs.validate-k8s.result == 'success' && '✅' || needs.validate-k8s.result == 'skipped' && '⏭️' || '❌' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 보안 스캔 | ${{ needs.security-scan.result == 'success' && '✅' || '❌' }} |" >> $GITHUB_STEP_SUMMARY

